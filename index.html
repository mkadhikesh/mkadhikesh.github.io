<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adhikesh M - Portfolio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            animation: fadeIn 1.2s ease-in-out;
        }
        h1 { margin-bottom: 15px; color: #38bdf8; font-size: 28px; }
        p { color: #94a3b8; font-size: 16px; line-height: 1.6; margin-bottom: 25px; }
        .btn-group { display: flex; gap: 12px; justify-content: center; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn:hover { background: #0ea5e9; transform: translateY(-2px); }
        .btn-outline {
            background: transparent;
            border: 1px solid #38bdf8;
            color: #38bdf8;
        }
        .btn-outline:hover { background: rgba(56, 189, 248, 0.1); }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hi, I'm Adhikesh</h1>
        <p>Welcome to my professional portfolio. Hosted live and secured on my custom domain!</p>
        <div class="btn-group">
            <a href="https://github.com/Sharkelim" class="btn" target="_blank">GitHub</a>
            <a href="mailto:mkadhikesh.portfolio@gmail.com" class="btn btn-outline">Contact</a>
        </div>
    </div>
</body>
</html>
