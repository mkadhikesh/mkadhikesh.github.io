<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Adhikesh M</title>
    <style>
        /* --- APPLE-STYLE MINIMALISM --- */
        :root {
            --bg-color: #fbfbfd;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent-blue: #0066cc;
            --accent-hover: #0077ed;
            --card-bg: #ffffff;
            --border-color: rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* --- NAVIGATION --- */
        nav {
            background: rgba(251, 251, 253, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }
        
        .logo { font-weight: 600; font-size: 20px; color: var(--text-main); text-decoration: none; letter-spacing: -0.5px; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }
        .nav-links a:hover { opacity: 1; }
        .nav-links a.active { opacity: 1; font-weight: 600; color: var(--accent-blue); }

        /* --- MAIN LAYOUT --- */
        main {
            margin-top: 100px;
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 900px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            animation: fadeUp 0.8s ease-out;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
            width: 100%;
        }
        
        .page-header h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -1.2px;
            margin-bottom: 16px;
        }
        
        .page-header p {
            font-size: 20px;
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 auto;
        }

        /* --- CONTACT CONTAINER --- */
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 40px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            width: 100%;
        }

        /* Contact Details Side */
        .contact-info h3 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .contact-link {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: #f5f5f7;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            margin-bottom: 12px;
            transition: all 0.2s ease;
            font-weight: 500;
            font-size: 15px;
        }
        
        .contact-link:hover {
            background: #ebebeb;
            transform: scale(1.02);
        }
        
        .icon { font-size: 20px; margin-right: 12px; }

        /* Form Side */
        .form-group { margin-bottom: 20px; }
        
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input, textarea {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: #f5f5f7;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
        }
        
        textarea { resize: vertical; min-height: 120px; }
        
        .btn-submit {
            display: inline-block;
            width: 100%;
            padding: 16px;
            border-radius: 980px;
            background-color: var(--accent-blue);
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .btn-submit:hover { background-color: var(--accent-hover); }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 12px;
            margin-top: auto;
            width: 100%;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .contact-container { grid-template-columns: 1fr; gap: 30px; padding: 30px; }
            .page-header h1 { font-size: 38px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Adhikesh M</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <main>
        <div class="page-header">
            <h1>Secure Comms.</h1>
            <p>Initiate contact for security assessments, collaborations, or professional inquiries.</p>
        </div>

        <div class="contact-container">
            <!-- Left Side: Direct Links -->
            <div class="contact-info">
                <h3>Direct Channels</h3>
                
                <a href="tel:+916381014376" class="contact-link">
                    <span class="icon">📞</span> +91 6381014376
                </a>

                <a href="mailto:mkadhikesh@gmail.com" class="contact-link">
                    <span class="icon">✉️</span> mkadhikesh@gmail.com
                </a>
                
                <a href="https://instagram.com/dimensity.8350" target="_blank" class="contact-link">
                    <span class="icon">📸</span> @dimensity.8350
                </a>

                <a href="https://www.linkedin.com/in/adhikesh-m" target="_blank" class="contact-link">
                    <span class="icon">🔗</span> Adhikesh M
                </a>
                
                <a href="https://github.com/Sharkelim" target="_blank" class="contact-link">
                    <span class="icon">💻</span> github.com/Sharkelim
                </a>
            </div>

            <!-- Right Side: Form -->
            <form action="mailto:mkadhikesh@gmail.com" method="POST" enctype="text/plain" class="contact-form">
                <div class="form-group">
                    <label for="name">Identifier (Name)</label>
                    <input type="text" id="name" name="Name" required placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label for="message">Transmission (Message)</label>
                    <textarea id="message" name="Message" required placeholder="How can we collaborate?"></textarea>
                </div>
                
                <button type="submit" class="btn-submit">Initialize Connection</button>
            </form>
        </div>
    </main>

    <footer>
        &copy; 2026 Adhikesh M. All rights reserved.
    </footer>

</body>
</html>
